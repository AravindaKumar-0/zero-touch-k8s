apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zero-touch-k8s.fullname" . }}
  labels:
    {{- include "zero-touch-k8s.labels" . | nindent 4 }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.paths.backend }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "zero-touch-k8s.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}

          - path: {{ .Values.ingress.paths.frontend }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "zero-touch-k8s.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}