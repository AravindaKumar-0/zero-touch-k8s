apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "zero-touch-k8s.fullname" . }}-data
  labels:
    {{- include "zero-touch-k8s.labels" . | nindent 4 }}

spec:
  accessModes:
    - {{ .Values.storage.accessMode }}

  resources:
    requests:
      storage: {{ .Values.storage.size }}

  storageClassName: {{ .Values.storage.storageClass }}