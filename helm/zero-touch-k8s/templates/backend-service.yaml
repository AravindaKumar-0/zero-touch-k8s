apiVersion: v1
kind: Service
metadata:
  name: {{ include "zero-touch-k8s.fullname" . }}-backend
  labels:
    app: backend
    {{- include "zero-touch-k8s.labels" . | nindent 4 }}

spec:
  type: {{ .Values.backend.service.type }}

  selector:
    app: backend

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}